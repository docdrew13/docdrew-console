<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3E8F5E">
<meta property="og:title" content="Grocery list">
<meta property="og:description" content="Tap to check items off as you shop.">
<title>Grocery list</title>
<style>
  :root{
    --bg:#F4F6F4; --card:#FFFFFF; --ink:#18221C; --dim:#617066; --line:#E1E7E2;
    --accent:#2F8050; --accent-ink:#FFFFFF; --accent-soft:#E3F2E8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0E1512; --card:#161F1A; --ink:#E9F0EB; --dim:#93A399; --line:#25322B;
           --accent:#4FBF7A; --accent-ink:#0C3320; --accent-soft:#1B2C22; }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font:17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding:env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom)); }
  main{ max-width:560px; margin:0 auto; }
  header{ padding:26px 2px 14px; }
  h1{ margin:0; font-size:28px; letter-spacing:-0.01em; }
  .sub{ margin-top:4px; color:var(--dim); font-size:15px; }
  .bar{ height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin:14px 0 6px; }
  .bar i{ display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .3s ease; }
  .count{ font-size:14px; color:var(--dim); }
  .cat{ margin:22px 0 8px 4px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  label.row{ display:flex; align-items:center; gap:14px; padding:14px 16px; min-height:54px; cursor:pointer;
             border-top:1px solid var(--line); transition:opacity .35s ease, max-height .35s ease, padding .35s ease, min-height .35s ease;
             max-height:120px; -webkit-tap-highlight-color:transparent; }
  label.row:first-child{ border-top:0; }
  label.row input{ position:absolute; opacity:0; pointer-events:none; }
  .box{ flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--dim); display:grid; place-items:center;
        transition:background .15s, border-color .15s; }
  .box svg{ width:16px; height:16px; stroke:var(--accent-ink); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
  input:checked + .box{ background:var(--accent); border-color:var(--accent); }
  input:checked + .box svg{ opacity:1; }
  input:focus-visible + .box{ outline:3px solid var(--accent-soft); outline-offset:2px; }
  .txt{ flex:1; font-size:18px; }
  label.row.done .txt{ text-decoration:line-through; color:var(--dim); }
  label.row.leaving{ opacity:0; max-height:0; padding-top:0; padding-bottom:0; min-height:0; overflow:hidden; }
  .card:empty{ display:none; }
  .toggle{ display:block; margin:26px auto 0; background:none; border:0; color:var(--accent); font:inherit; font-size:15px;
           font-weight:600; padding:10px 14px; cursor:pointer; }
  .alldone{ text-align:center; margin:40px 0 0; padding:28px 18px; background:var(--accent-soft); border-radius:14px; font-size:19px; font-weight:600; }
  .alldone small{ display:block; margin-top:4px; color:var(--dim); font-size:15px; font-weight:400; }
  .msg{ text-align:center; color:var(--dim); margin-top:60px; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Grocery list</h1>
    <div class="sub" id="sub"></div>
    <div class="bar" id="barwrap" hidden><i id="bar"></i></div>
    <div class="count" id="count"></div>
  </header>
  <div id="list"></div>
  <div class="alldone" id="alldone" hidden></div>
  <button class="toggle" id="toggle" type="button" hidden></button>
  <div class="msg" id="msg">Loading…</div>
</main>
<script>
(function(){
  var STR = {
    en: { title:"Grocery list", left:function(n){ return n === 1 ? "1 item left" : n + " items left"; },
          done:"All done!", doneSub:"Everything is checked off.",
          show:function(n){ return n === 1 ? "Show 1 checked-off item" : "Show " + n + " checked-off items"; },
          hide:"Hide checked-off items", from:function(n){ return "Shared by " + n; },
          missing:"This list could not be found. Ask for a new link.", failed:"Could not load the list. Check your connection and try again.",
          locale:"en-CA" },
    fr: { title:"Liste d’épicerie", left:function(n){ return n === 1 ? "1 article restant" : n + " articles restants"; },
          done:"Tout est fait!", doneSub:"Tout est coché.",
          show:function(n){ return n === 1 ? "Afficher 1 article coché" : "Afficher " + n + " articles cochés"; },
          hide:"Masquer les articles cochés", from:function(n){ return "Partagé par " + n; },
          missing:"Cette liste est introuvable. Demandez un nouveau lien.", failed:"Impossible de charger la liste. Vérifiez votre connexion et réessayez.",
          locale:"fr-CA" }
  };
  var $ = function(id){ return document.getElementById(id); };
  var id = new URLSearchParams(location.search).get("id") || (location.pathname.match(/\/l\/([a-z0-9]+)/) || [])[1] || "";
  var KEY = "gl-checked-" + id;
  var checked = {}, showChecked = false, snap = null, S = STR.en;
  try { checked = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ checked = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(checked)); } catch(e){} }

  function build(){
    var list = $("list"); list.innerHTML = "";
    var total = 0, left = 0;
    snap.groups.forEach(function(g, gi){
      var card = document.createElement("div"); card.className = "card";
      var shown = 0;
      g.items.forEach(function(text, ii){
        var key = gi + ":" + ii;
        total++;
        var isDone = !!checked[key];
        if(!isDone) left++;
        if(isDone && !showChecked) return;
        shown++;
        var row = document.createElement("label"); row.className = "row" + (isDone ? " done" : "");
        row.innerHTML = '<input type="checkbox"' + (isDone ? " checked" : "") + '><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="txt"></span>';
        row.querySelector(".txt").textContent = text;
        row.querySelector("input").addEventListener("change", function(e){
          if(e.target.checked){ checked[key] = true; } else { delete checked[key]; }
          save();
          if(e.target.checked && !showChecked){
            row.classList.add("leaving");
            setTimeout(build, 380);   // let the row fade out, then redraw without it
          } else { build(); }
        });
        card.appendChild(row);
      });
      if(shown){
        var h = document.createElement("div"); h.className = "cat"; h.textContent = g.label;
        list.appendChild(h); list.appendChild(card);
      }
    });
    var doneCount = total - left;
    $("barwrap").hidden = total === 0;
    $("bar").style.width = (total ? Math.round(doneCount / total * 100) : 0) + "%";
    $("count").textContent = S.left(left);
    $("alldone").hidden = left !== 0;
    $("alldone").innerHTML = "";
    if(left === 0){ var d = document.createElement("div"); d.textContent = S.done; var sm = document.createElement("small"); sm.textContent = S.doneSub; $("alldone").appendChild(d); $("alldone").appendChild(sm); }
    $("toggle").hidden = doneCount === 0;
    $("toggle").textContent = showChecked ? S.hide : S.show(doneCount);
  }
  $("toggle").addEventListener("click", function(){ showChecked = !showChecked; build(); });

  if(!id){ $("msg").textContent = STR.en.missing; return; }
  fetch("/api/grocery-share?id=" + encodeURIComponent(id)).then(function(r){
    if(r.status === 404){ throw "missing"; }
    if(!r.ok){ throw "failed"; }
    return r.json();
  }).then(function(data){
    snap = data; S = STR[data.lang] || STR.en;
    document.documentElement.lang = data.lang === "fr" ? "fr" : "en";
    var t = data.title || S.title;
    $("title").textContent = t; document.title = t;
    var when = ""; try { when = new Date(data.created).toLocaleDateString(S.locale, { weekday:"long", month:"long", day:"numeric" }); } catch(e){}
    $("sub").textContent = [data.from ? S.from(data.from) : "", when].filter(Boolean).join(" · ");
    $("msg").hidden = true;
    build();
  }).catch(function(e){
    document.documentElement.lang = "en";
    $("msg").textContent = e === "missing" ? STR.en.missing : STR.en.failed;
  });
})();
</script>
</body>
</html>
