<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Planner</title>
<style>
  :root[data-theme="light"]{
    --bg:#f3f6fb;
    --surface:#ffffff;
    --surface-alt:#f8fafc;
    --border:#e3e8f0;
    --text:#0f172a;
    --text-muted:#647089;
    --primary:#1d4ed8;
    --primary-hover:#1741b3;
    --primary-light:#e2eafd;
    --teal:#0d9488;
    --teal-light:#d9f5f1;
    --amber:#b45309;
    --amber-light:#fef1d6;
    --danger:#dc2626;
    --danger-light:#fde3e3;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 8px 24px -12px rgba(15,23,42,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0a0f1c;
    --surface:#111a2c;
    --surface-alt:#0d1526;
    --border:#233150;
    --text:#e8edf7;
    --text-muted:#93a1bd;
    --primary:#6d93ff;
    --primary-hover:#87a5ff;
    --primary-light:#1c2c52;
    --teal:#3fd8c6;
    --teal-light:#0f342f;
    --amber:#f2b84b;
    --amber-light:#3a2c10;
    --danger:#ff6b6b;
    --danger-light:#3a1616;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 8px 28px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  ::selection{background:var(--primary-light);}

  #app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:12px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--primary),var(--teal));
    display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  }
  .brand-text h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .brand-text p{font-size:11.5px;margin:0;color:var(--text-muted);}
  .topbar-spacer{flex:1;}
  .topbar-actions{display:flex;gap:8px;align-items:center;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 13px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-alt);}
  .btn:active{transform:translateY(1px);}
  .btn-icon{padding:8px;}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{background:var(--danger-light);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:7px;}
  .icon{width:16px;height:16px;flex-shrink:0;}
  .icon-sm{width:14px;height:14px;}

  /* ---------- Layout ---------- */
  .layout{flex:1;display:flex;min-height:0;}
  .sidebar{
    width:280px;flex-shrink:0;border-right:1px solid var(--border);
    background:var(--surface);display:flex;flex-direction:column;min-height:0;
  }
  .sidebar-header{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
  .sidebar-header h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0;font-weight:700;}
  .trip-list{flex:1;overflow-y:auto;padding:4px 10px 14px;display:flex;flex-direction:column;gap:6px;}
  .trip-card{
    padding:10px 12px;border-radius:var(--radius-md);cursor:pointer;
    border:1px solid transparent;position:relative;transition:background .12s,border-color .12s;
  }
  .trip-card:hover{background:var(--surface-alt);}
  .trip-card.active{background:var(--primary-light);border-color:var(--primary);}
  .trip-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .trip-card-name{font-size:13.5px;font-weight:700;line-height:1.3;}
  .trip-card-dest{font-size:12px;color:var(--text-muted);margin-top:1px;}
  .trip-card-dates{font-size:11.5px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;gap:5px;}
  .badge{
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;
    text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
  }
  .badge-upcoming{background:var(--primary-light);color:var(--primary);}
  .badge-ongoing{background:var(--teal-light);color:var(--teal);}
  .badge-past{background:var(--surface-alt);color:var(--text-muted);}
  .empty-sidebar{padding:22px 16px;text-align:center;color:var(--text-muted);font-size:12.5px;line-height:1.5;}

  /* ---------- Content ---------- */
  .content{flex:1;overflow-y:auto;min-height:0;}
  .content-inner{max-width:980px;margin:0 auto;padding:28px 28px 60px;}

  /* Overview / home */
  .home-hero{margin-bottom:22px;}
  .home-hero h2{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em;}
  .home-hero p{color:var(--text-muted);margin:0;font-size:14px;max-width:640px;line-height:1.55;}
  .stat-row{display:flex;gap:12px;margin:20px 0 26px;flex-wrap:wrap;}
  .stat-box{
    flex:1;min-width:130px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:14px 16px;
  }
  .stat-box .num{font-size:24px;font-weight:800;}
  .stat-box .label{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .section-title{font-size:14px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
  .trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .trip-tile{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:16px;cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .1s;
  }
  .trip-tile:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .trip-tile-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
  .trip-tile h3{font-size:15.5px;margin:0;font-weight:800;}
  .trip-tile .dest{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .trip-tile-meta{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted);margin-top:10px;}
  .trip-tile-meta div{display:flex;align-items:center;gap:6px;}
  .countdown-pill{
    margin-top:12px;font-size:12px;font-weight:700;color:var(--primary);
    background:var(--primary-light);display:inline-block;padding:4px 10px;border-radius:99px;
  }

  .empty-state{
    text-align:center;padding:50px 20px;border:1.5px dashed var(--border);border-radius:var(--radius-lg);
    color:var(--text-muted);
  }
  .empty-state .icon-wrap{
    width:52px;height:52px;border-radius:50%;background:var(--primary-light);color:var(--primary);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  }
  .empty-state h3{color:var(--text);font-size:15px;margin:0 0 6px;}
  .empty-state p{font-size:13px;max-width:420px;margin:0 auto 16px;line-height:1.6;}

  /* Trip detail */
  .trip-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  .trip-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .editable-title{
    font-size:24px;font-weight:800;border:none;background:transparent;color:var(--text);
    padding:2px 4px;border-radius:6px;min-width:120px;letter-spacing:-.01em;
  }
  .editable-title:hover, .editable-title:focus{background:var(--surface-alt);outline:none;}
  .trip-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .trip-subrow{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 18px;color:var(--text-muted);font-size:13px;}
  .trip-subrow .field{display:flex;align-items:center;gap:6px;}
  .trip-subrow input{
    border:1px solid transparent;background:transparent;color:var(--text);font-size:13px;
    border-radius:6px;padding:3px 6px;font-family:inherit;
  }
  .trip-subrow input:hover, .trip-subrow input:focus{border-color:var(--border);background:var(--surface);outline:none;}
  .trip-subrow input[type="date"]{color:var(--text);}

  .transport-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 20px;}
  .transport-chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:99px;
    border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);
    font-size:12.5px;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s,color .12s;
  }
  .transport-chip:hover{border-color:var(--primary);color:var(--text);}
  .transport-chip.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
  .transport-chip .chip-box{
    width:15px;height:15px;border-radius:4px;border:1.5px solid currentColor;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:9.5px;font-weight:800;line-height:1;
  }
  .transport-chip.active .chip-box{background:var(--primary);border-color:var(--primary);}
  .link-toggle{
    background:none;border:none;color:var(--primary);font-size:12px;font-weight:700;cursor:pointer;
    padding:4px 8px;border-radius:6px;white-space:nowrap;
  }
  .link-toggle:hover{background:var(--primary-light);}
  .mini-input{
    border:1px solid var(--border);background:var(--surface-alt);color:var(--text);border-radius:7px;
    padding:5px 7px;font-size:12.5px;font-family:inherit;width:50px;text-align:center;
  }
  .mini-input:focus{outline:2px solid var(--primary-light);border-color:var(--primary);}
  .drive-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 18px;font-size:12.5px;color:var(--text-muted);}
  .rv-note{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--amber);
    background:var(--amber-light);border-radius:var(--radius-sm);padding:9px 13px;margin:-10px 0 18px;line-height:1.4;
  }

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab-btn{
    padding:9px 14px;font-size:13px;font-weight:700;color:var(--text-muted);
    background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
    display:flex;align-items:center;gap:6px;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}

  .notes-box{
    width:100%;min-height:70px;border:1px solid var(--border);border-radius:var(--radius-md);
    background:var(--surface);color:var(--text);padding:10px 12px;font-family:inherit;font-size:13px;
    resize:vertical;
  }
  .notes-box:focus{outline:2px solid var(--primary-light);border-color:var(--primary);}

  /* Days / itinerary */
  .day-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    margin-bottom:14px;overflow:hidden;
  }
  .day-head{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    background:var(--surface-alt);border-bottom:1px solid var(--border);
  }
  .day-badge{
    width:30px;height:30px;border-radius:9px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;
  }
  .day-head input.day-label{
    font-weight:700;font-size:14px;border:none;background:transparent;color:var(--text);flex:1;min-width:80px;
    padding:3px 6px;border-radius:6px;
  }
  .day-head input.day-label:hover, .day-head input.day-label:focus{background:var(--surface);outline:none;}
  .day-head input[type="date"]{
    border:1px solid transparent;background:transparent;color:var(--text-muted);font-size:12px;border-radius:6px;padding:3px 6px;
  }
  .day-head input[type="date"]:hover, .day-head input[type="date"]:focus{border-color:var(--border);background:var(--surface);}
  .day-body{padding:10px 16px 14px;}
  .activity-row{
    display:grid;grid-template-columns:86px 1fr 1fr 74px auto;gap:8px;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--border);
  }
  .activity-row:last-of-type{border-bottom:none;}
  .activity-row input{
    border:1px solid transparent;background:transparent;color:var(--text);font-size:13px;
    padding:6px 7px;border-radius:7px;font-family:inherit;width:100%;
  }
  .activity-row input:hover, .activity-row input:focus{border-color:var(--border);background:var(--surface-alt);outline:none;}
  .activity-row input.act-time{font-variant-numeric:tabular-nums;color:var(--primary);font-weight:700;}
  .no-items{color:var(--text-muted);font-size:12.5px;padding:8px 2px 4px;}
  .act-cost{font-variant-numeric:tabular-nums;color:var(--teal) !important;font-weight:700;text-align:right;}

  /* Budget */
  .budget-pill{
    font-size:12px;font-weight:700;color:var(--teal);
    background:var(--teal-light);display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;border-radius:99px;cursor:default;
  }
  .budget-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;
  }
  .budget-row:last-of-type{border-bottom:none;}
  .budget-row .label{color:var(--text);}
  .budget-row .sub{color:var(--text-muted);font-size:11.5px;margin-top:1px;}
  .budget-row .amt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal);white-space:nowrap;}
  .budget-note{color:var(--text-muted);font-size:12px;line-height:1.5;margin:4px 2px 14px;}

  /* Waypoints / Stops */
  .waypoint-block{padding:8px 0;border-bottom:1px solid var(--border);}
  .waypoint-block:last-of-type{border-bottom:none;}
  .waypoint-row{display:grid;grid-template-columns:26px 1fr 150px 80px 84px auto;gap:8px;align-items:center;}
  .waypoint-order{
    width:24px;height:24px;border-radius:50%;background:var(--primary-light);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;
  }
  .waypoint-row input{
    border:1px solid var(--border);background:var(--surface-alt);color:var(--text);font-size:13px;
    padding:6px 8px;border-radius:7px;font-family:inherit;width:100%;
  }
  .waypoint-row input:focus{outline:2px solid var(--primary-light);border-color:var(--primary);}
  .waypoint-actions{display:flex;gap:2px;flex-shrink:0;}
  .waypoint-notes{
    display:block;width:100%;margin-top:6px;border:1px solid transparent;background:transparent;
    color:var(--text-muted);font-size:12.5px;padding:5px 7px;border-radius:6px;font-family:inherit;
  }
  .waypoint-notes:hover, .waypoint-notes:focus{border-color:var(--border);background:var(--surface-alt);color:var(--text);outline:none;}

  /* Bookings */
  .booking-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:14px 16px;margin-bottom:12px;
  }
  .booking-top{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .booking-type-badge{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .type-flight{background:var(--primary-light);color:var(--primary);}
  .type-hotel{background:var(--teal-light);color:var(--teal);}
  .type-car{background:var(--amber-light);color:var(--amber);}
  .type-train{background:var(--primary-light);color:var(--primary);}
  .type-activity{background:var(--teal-light);color:var(--teal);}
  .type-other{background:var(--surface-alt);color:var(--text-muted);}
  .booking-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;}
  .booking-grid .full{grid-column:1/-1;}
  .field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:3px;font-weight:700;}
  .booking-grid input, .booking-grid select, .booking-grid textarea{
    width:100%;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);
    border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;
  }
  .booking-grid input:focus, .booking-grid select:focus, .booking-grid textarea:focus{
    outline:2px solid var(--primary-light);border-color:var(--primary);
  }
  .booking-foot{display:flex;justify-content:flex-end;margin-top:8px;}

  .add-row-btn{
    display:flex;align-items:center;gap:6px;color:var(--primary);background:transparent;border:1px dashed var(--border);
    border-radius:var(--radius-sm);padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;width:100%;
    justify-content:center;margin-top:4px;
  }
  .add-row-btn:hover{background:var(--primary-light);border-color:var(--primary);}

  .icon-btn{
    width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:transparent;
    color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .icon-btn:hover{background:var(--danger-light);color:var(--danger);}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,14,25,.5);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-box{
    background:var(--surface);border-radius:var(--radius-lg);padding:22px;max-width:380px;width:100%;
    box-shadow:var(--shadow-md);border:1px solid var(--border);
  }
  .modal-box h3{margin:0 0 8px;font-size:16px;}
  .modal-box p{margin:0 0 18px;font-size:13.5px;color:var(--text-muted);line-height:1.55;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;
    box-shadow:var(--shadow-md);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  @media (max-width:760px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;max-height:220px;border-right:none;border-bottom:1px solid var(--border);}
    .content-inner{padding:18px 16px 50px;}
    .activity-row{grid-template-columns:70px 1fr;}
    .activity-row .act-cost{grid-column:1/-1;text-align:left;}
    .activity-row .icon-btn{grid-column:2;justify-self:end;}
    .booking-grid{grid-template-columns:1fr;}
    .waypoint-row{grid-template-columns:22px 1fr;}
    .waypoint-row input[type="date"], .waypoint-row input[type="number"]{grid-column:2;}
    .waypoint-actions{grid-column:2;justify-self:end;}
  }

  @media print{
    @page{ margin:0.55in 0.65in; }
    .topbar, .sidebar, .tabs, .add-row-btn, .icon-btn, .trip-actions, .btn{display:none !important;}
    #printArea{display:block !important;}
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:0;}
  }
  #printArea{display:none;font-family:'Georgia',ui-serif,serif;color:#1a1a1a;}
  #printArea .print-kicker{font-family:inherit;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#888;margin:0 0 3px;}
  #printArea h2{font-size:21px;margin:0 0 3px;letter-spacing:-.01em;}
  #printArea .print-meta{font-size:11.5px;color:#444;margin:0 0 4px;line-height:1.5;}
  #printArea .print-extra{font-size:10.5px;color:#666;margin:0 0 10px;line-height:1.5;}
  #printArea .print-coverline{border-bottom:1.5px solid #1a1a1a;padding-bottom:10px;margin-bottom:14px;}
  #printArea .print-budget-strip{display:flex;gap:18px;font-size:11px;color:#333;margin:0 0 14px;padding:8px 10px;background:#f4f4f2;border-radius:5px;}
  #printArea .print-budget-strip b{font-size:13px;display:block;color:#111;}
  #printArea h3{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid #ccc;color:#111;break-after:avoid;page-break-after:avoid;}
  #printArea h3:first-of-type{margin-top:0;}
  .print-day{margin-bottom:10px;page-break-inside:avoid;}
  .print-day h4{margin:0 0 5px;font-size:12.5px;font-weight:700;border-bottom:1px solid #ddd;padding-bottom:3px;}
  .print-activity{font-size:11.5px;padding:2px 0;display:flex;gap:10px;line-height:1.4;}
  .print-activity .t{font-weight:700;width:52px;flex-shrink:0;color:#333;}
  .print-booking{font-size:11.5px;padding:5px 0;border-bottom:1px solid #eee;line-height:1.4;page-break-inside:avoid;}
  .print-research{font-size:12px;line-height:1.65;color:#222;white-space:pre-wrap;}
  .print-footer{margin-top:22px;padding-top:6px;border-top:1px solid #ddd;font-size:9px;color:#999;font-family:ui-sans-serif,system-ui,sans-serif;}

  /* ---------- Long Weekend Trips (distinct "idea board" style) ---------- */
  .lw-nav-card{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin:10px 12px 10px;border:1.5px dashed var(--amber);border-radius:var(--radius-md);cursor:pointer;background:var(--amber-light);transition:border-style .1s;}
  .lw-nav-card:hover{border-style:solid;}
  .lw-nav-card.active{border-style:solid;box-shadow:var(--shadow-sm);}
  .lw-nav-icon{color:var(--amber);flex-shrink:0;margin-top:1px;}
  .lw-nav-title{font-weight:700;font-size:13px;color:var(--amber);}
  .lw-nav-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .lw-sidebar-divider{margin:0 12px 4px;border-bottom:1px solid var(--border);}
  .lw-hero{background:var(--amber-light);border:1px solid var(--amber);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;}
  .lw-hero h2{margin:0 0 6px;font-size:20px;color:var(--text);display:flex;align-items:center;gap:8px;}
  .lw-hero h2 .icon{color:var(--amber);width:20px;height:20px;}
  .lw-hero p{margin:0;color:var(--text-muted);font-size:13.5px;line-height:1.55;max-width:760px;}
  .lw-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .lw-toggle button{padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .lw-toggle button.active{border-color:var(--amber);background:var(--amber-light);color:var(--amber);}
  .lw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  .lw-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--amber);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:8px;}
  .lw-card h3{margin:0;font-size:15px;color:var(--text);}
  .lw-card .lw-meta{font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:10px;}
  .lw-card .lw-meta span{display:inline-flex;align-items:center;gap:4px;}
  .lw-card .lw-budget{font-size:13px;font-weight:700;color:var(--amber);display:flex;align-items:center;gap:5px;}
  .lw-card .lw-highlights{font-size:12.5px;color:var(--text);line-height:1.5;}
  .lw-card .lw-dog{font-size:12px;color:var(--teal);background:var(--teal-light);padding:7px 9px;border-radius:7px;line-height:1.45;display:flex;gap:6px;align-items:flex-start;}
  .lw-card .lw-dog .icon-sm{flex-shrink:0;margin-top:2px;}
  .lw-promote-row{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .btn-amber{background:var(--amber-light);border:1px solid var(--amber);color:var(--amber);}
  .btn-amber:hover{background:var(--amber);color:#fff;}
  .lw-promoted-note{font-size:11px;color:var(--teal);font-weight:700;white-space:nowrap;}

  /* ---------- Travel Tools (Climate + Neighborhood Finder) ---------- */
  .tt-nav-card{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin:0 12px 10px;border:1.5px dashed var(--teal);border-radius:var(--radius-md);cursor:pointer;background:var(--teal-light);transition:border-style .1s;}
  .tt-nav-card:hover{border-style:solid;}
  .tt-nav-card.active{border-style:solid;box-shadow:var(--shadow-sm);}
  .tt-nav-icon{color:var(--teal);flex-shrink:0;margin-top:1px;}
  .tt-nav-title{font-weight:700;font-size:13px;color:var(--teal);}
  .tt-nav-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .tt-sidebar-divider{margin:0 12px 4px;border-bottom:1px solid var(--border);}
  .tt-hero{background:var(--teal-light);border:1px solid var(--teal);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;}
  .tt-hero h2{margin:0 0 6px;font-size:20px;color:var(--text);display:flex;align-items:center;gap:8px;}
  .tt-hero h2 .icon{color:var(--teal);width:20px;height:20px;}
  .tt-hero p{margin:0;color:var(--text-muted);font-size:13.5px;line-height:1.55;max-width:760px;}
  .tt-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .tt-toggle button{padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .tt-toggle button.active{border-color:var(--teal);background:var(--teal-light);color:var(--teal);}
  .tt-dest-picker{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .tt-dest-picker select{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit;min-width:280px;}
  .tt-dest-picker .tt-asof{font-size:11px;color:var(--text-muted);}
  .tt-empty{background:var(--surface-alt);border:1px dashed var(--border);border-radius:var(--radius-md);padding:26px;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.65;}
  .tt-empty strong{color:var(--text);}
  .tt-forecast-banner{background:var(--primary-light);border:1px solid var(--primary);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:16px;font-size:12.5px;color:var(--text);line-height:1.55;}
  .tt-months-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;}
  .tt-months-table th{text-align:left;color:var(--text-muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1.5px solid var(--border);}
  .tt-months-table td{padding:7px 8px;border-bottom:1px solid var(--border);}
  .tt-months-table tr.tt-travel-month{background:var(--teal-light);}
  .tt-months-table tr.tt-travel-month td:first-child{font-weight:700;color:var(--teal);}
  .tt-patterns-note{font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .tt-neigh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .tt-neigh-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:8px;}
  .tt-neigh-card h3{margin:0;font-size:15px;color:var(--text);}
  .tt-neigh-cost{font-size:13px;font-weight:700;color:var(--teal);}
  .tt-neigh-row{font-size:12.5px;color:var(--text);line-height:1.5;}
  .tt-neigh-row b{color:var(--text-muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:1px;}
  .tt-source{font-size:10.5px;color:var(--text-muted);margin-top:16px;font-style:italic;}

  /* ---------- Travel Tools: Quick Research ---------- */
  .tt-qr-form{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:18px;}
  .tt-qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:12px;}
  .tt-qr-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:4px;}
  .tt-qr-field input, .tt-qr-field select, .tt-qr-field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;}
  .tt-qr-field textarea{min-height:56px;resize:vertical;}
  .tt-qr-daterow{display:flex;align-items:center;gap:6px;}
  .tt-qr-daterow input{width:0;flex:1;}
  .tt-qr-actions{margin-bottom:8px;}
  .tt-qr-hint{margin:0;font-size:11.5px;color:var(--text-muted);line-height:1.5;}
  .tt-qr-list{display:flex;flex-direction:column;gap:12px;}
  .tt-qr-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:var(--radius-md);padding:16px;}
  .tt-qr-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .tt-qr-card-title{font-weight:700;font-size:14px;color:var(--text);}
  .tt-qr-card-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .tt-qr-pending{font-size:12.5px;color:var(--text-muted);font-style:italic;margin-bottom:10px;}
  .tt-qr-summary{font-size:12.5px;color:var(--text);line-height:1.55;margin-bottom:12px;}
  .tt-qr-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:10px;}
  .tt-qr-option{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface-alt);}
  .tt-qr-option-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:3px;}
  .tt-qr-price{font-weight:700;color:var(--teal);white-space:nowrap;}
  .tt-qr-option-row{font-size:11.5px;line-height:1.5;color:var(--text);}
  .tt-qr-link{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:700;color:var(--primary);text-decoration:none;}
  .tt-qr-link:hover{text-decoration:underline;}
  .tt-qr-card-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- Travel Tools: Currency Converter ---------- */
  .tt-cc-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;}
  .tt-cc-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .tt-cc-field{flex:1;min-width:150px;}
  .tt-cc-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:4px;}
  .tt-cc-field input, .tt-cc-field select{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit;}
  .tt-cc-swap{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--teal);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:1px;}
  .tt-cc-swap:hover{background:var(--teal-light);border-color:var(--teal);}
  .tt-cc-result{font-size:22px;text-align:center;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:14px;}
  .tt-cc-answer{color:var(--teal);}
  .tt-cc-empty{font-size:14px;color:var(--text-muted);}
  .tt-cc-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .tt-cc-quick button{padding:6px 12px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:12px;font-weight:700;cursor:pointer;}
  .tt-cc-quick button:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-light);}

  /* ---------- Home Base ---------- */
  .homebase-card{margin:12px 12px 10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-alt);}
  .homebase-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--text-muted);display:flex;align-items:center;gap:5px;margin-bottom:7px;}
  .homebase-city-wrap{position:relative;margin-bottom:6px;}
  .homebase-city-input,.homebase-airport-input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:12.5px;font-family:inherit;}
  .homebase-city-input:focus,.homebase-airport-input:focus{outline:none;border-color:var(--primary);}
  .homebase-airport-input{text-transform:uppercase;}
  .homebase-dropdown{display:none;position:absolute;top:100%;left:0;right:0;margin-top:3px;background:var(--surface);border:1px solid var(--border);border-radius:7px;box-shadow:var(--shadow-md);max-height:220px;overflow-y:auto;z-index:20;}
  .homebase-dropdown.open{display:block;}
  .homebase-option{padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--text);}
  .homebase-option:hover{background:var(--primary-light);}
  .hb-airport{color:var(--text-muted);font-size:11px;font-weight:700;flex-shrink:0;}

  /* ---------- Trip-level airport search (near Destination) ---------- */
  .trip-subrow .airport-field-wrap{position:relative;}
  .airport-search-input{width:170px;text-transform:uppercase;}
  .airport-dropdown{display:none;position:absolute;top:100%;left:0;margin-top:3px;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:7px;box-shadow:var(--shadow-md);max-height:220px;overflow-y:auto;z-index:30;}
  .airport-dropdown.open{display:block;}
  .airport-option{padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--text);text-transform:none;}
  .airport-option:hover{background:var(--primary-light);}

  /* ---------- Print menu ---------- */
  .print-menu-wrap{position:relative;display:inline-block;}
  .print-menu{display:none;position:absolute;top:100%;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-md);min-width:240px;z-index:40;overflow:hidden;}
  .print-menu.open{display:block;}
  .print-menu-item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--text);}
  .print-menu-item:hover{background:var(--primary-light);}
  .print-menu-item .sub{display:block;font-size:10.5px;color:var(--text-muted);font-weight:400;}
  .print-menu-divider{border-top:1px solid var(--border);margin:2px 0;}
  .lang-toggle-pill span.active{background:var(--primary);color:#fff;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" onclick="goHome()">
      <div class="brand-mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-1 .1-1.3.5l-.7.7c-.4.4-.3 1 .2 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.4 5.8c.3.5.9.6 1.3.2l.7-.7c.4-.3.6-.8.4-1.3Z"/></svg></div>
      <div class="brand-text">
        <h1 id="shellTitle">Travel Planner</h1>
        <p id="shellTagline">Your trips, itineraries &amp; bookings in one place</p>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="btn btn-icon btn-ghost" id="shellDarkModeBtn" title="Toggle dark mode" onclick="toggleTheme()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
      <button class="btn" onclick="document.getElementById('importInput').click()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg> <span id="shellImportText">Import</span></button>
      <button class="btn" onclick="exportData()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg> <span id="shellExportText">Export</span></button>
      <button class="btn btn-primary" onclick="createTrip()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> <span id="shellNewTripText">New Trip</span></button>
      <div class="lang-toggle-pill" style="display:flex;border:1.5px solid var(--border);border-radius:999px;overflow:hidden;margin-left:6px">
        <span id="langToggleEn" onclick="toggleLang()" style="padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;color:var(--text-muted)">EN</span>
        <span id="langToggleFr" onclick="toggleLang()" style="padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;color:var(--text-muted);border-left:1.5px solid var(--border)">FR</span>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header"><h2 id="shellTripsHeading">Trips</h2></div>
      <div class="trip-list" id="tripList"></div>
    </aside>
    <main class="content"><div class="content-inner" id="content"></div></main>
  </div>
</div>
<input type="file" id="importInput" accept="application/json" hidden onchange="handleImport(event)">
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<div id="printArea"></div>

<script>
/* =========================================================
   TRAVEL PLANNER (copie autonome iCloud / standalone iCloud copy)
   -- BILINGUAL (EN / FR-CA)
   Self-contained dashboard with a language toggle chosen at
   the start. EN and FR are two independent trip datasets
   (STATE_BY_LANG.en / .fr) sharing the same code -- switching
   languages swaps which dataset is active without losing the
   other. Claude edits the correct SEED_STATE_EN / SEED_STATE_FR
   block when researching and adding trips, matching whichever
   language the user is actively working in. Use Export/Import
   per language to save/restore a JSON backup (no browser
   storage is used).
   ========================================================= */

const ICONS = {
  plane: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-1 .1-1.3.5l-.7.7c-.4.4-.3 1 .2 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.4 5.8c.3.5.9.6 1.3.2l.7-.7c.4-.3.6-.8.4-1.3Z"/></svg>',
  moon: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>',
  upload: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>',
  download: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>',
  plus: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash: '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>',
  calendar: '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',

function esc(str){
  return (str ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysUntil(d){
  if(!d) return null;
  const now = new Date(todayStr()+'T00:00:00');
  const target = new Date(d+'T00:00:00');
  return Math.round((target-now)/86400000);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);

}
function getTrip(id){ return state.trips.find(t=>t.id===id); }
function parseCost(v){
  if(v==null || v==='') return 0;
  const n = parseFloat(v.toString().replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}
function fmtMoney(n){
  const r = Math.round(n||0);
  return '$' + r.toLocaleString();
}
function tripTravelerCount(t){
  let n = parseInt((t.travelers||'').toString().replace(/[^0-9]/g,''), 10);
  if(!n || n<1) n = 2;
  return n;
}
function computeBudget(t){
  let lodging = 0, transport = 0, activities = 0;
  (t.waypoints||[]).forEach(wp=>{ lodging += parseCost(wp.nights) * parseCost(wp.estNightlyCost); });
  (t.bookings||[]).forEach(b=>{ transport += parseCost(b.estCost); });
  (t.days||[]).forEach(d=>{ (d.activities||[]).forEach(a=>{ activities += parseCost(a.estCost); }); });
  const total = lodging + transport + activities;
  const travelers = tripTravelerCount(t);
  return { lodging, transport, activities, total, travelers, perPerson: total/travelers };
}

      notes: 'RV + DOG VERSION — built as a separate trip from your original car/flight plan, adapted for RVing with your 120lb dog and reshaped into a true circle trip from home, not just a fly-to-Halifax loop with driving bolted on.\n\nNO FLIGHTS: a 120lb dog doesn\'t fit simple checked-pet transport on this route — Air Canada\'s checked-pet limit is 100lb including the kennel, and Porter no longer offers checked pets to regular travelers (military/government only); both would require a separate cargo booking. Per your call, this version drives the whole way from Granby instead.\n\nWHY THE ORDER CHANGED: driving from Granby, you pass right by the Fundy/Saint John, NB area on the most direct route to Nova Scotia — so this version visits Fundy FIRST (a single ~8h drive, no wasted overnight-only day) instead of saving it for the very end and looping back through Halifax to fly home. The route now runs Granby -> NB (Fundy) -> NS (Halifax, Cabot Trail) -> Newfoundland (ferry loop) -> NS -> PEI -> back across Confederation Bridge into NB (already explored, just transit) -> home to Granby. That\'s a genuine circle with only one overnight-only driving day (on the return, since Granby-to-PEI is the longest single hop) instead of two. Total length is about 22 days for the full stop list, versus the original 10-21 day core — trim guidance below still applies to cut it down.\n\nACCOMMODATION: switched to Campground/RV Park-first — nightly rates are far lower than the hotel/Airbnb estimates in the car version, which is the main reason this version costs less overall despite the pricier RV rental.\n\nPET NOTES BY STOP:\n- Marine Atlantic ferry: pets can ride in your vehicle (crack the windows/vents) or in a kennel; pet-friendly cabins exist on some vessels (book early) and there\'s a dog park at the Port aux Basques terminal. Since you\'ll be in the RV itself, she can likely just stay in it comfortably — nicer than a standard car.\n- Northumberland Ferry (Wood Islands): dogs explicitly welcome — can stay in-vehicle, in-kennel, or leashed with you on exterior decks; there\'s a fenced dog park at Wood Islands and pet relief areas at both terminals.\n- Skyline Trail (Cape Breton Highlands NP): dogs are NOT permitted at all (wildlife protection — moose/bear). Most other trails in the park do allow leashed dogs.\n- Gros Morne NP: leashed dogs are welcome on campsites, picnic areas, and most trails; not recommended on the Gros Morne Mountain summit trail. The Western Brook Pond approach trail should be fine leashed — the boat tour itself is a separate question (see below).\n- Boat tours (Western Brook Pond, Pleasant Bay whale watching, Twillingate iceberg/whale tour, Witless Bay puffins & whales): pet policies vary by operator and most only confirm allowing registered service animals, not pets generally — plan for one of you to stay with her in the RV during these, or call ahead to confirm.\n- RV rental: most companies accept pets, sometimes with a cleaning fee (~$50-150) — confirm this when booking.\n\nOriginal research doc (car/flight version) still applies for regional background: atlantic-canada-loop-trip.md, saved alongside this planner.',

      notes: 'UPDATED STRUCTURE: La Serena is now your home base for this trip — you\'re staying with a friend there at no lodging cost, and taking excursions from it (Elqui Valley day trips, plus a multi-day Patagonia excursion). You fly out to Patagonia and back through Santiago, so La Serena appears twice in the Stops list below (an outbound stay, then a return stay after Patagonia, before the flight home). Two 1-night Santiago buffers bookend the trip to protect the international connections.\n\nThis home-base shape means 4 domestic flight legs instead of 3 (an extra La Serena <-> Santiago repositioning each way) — but the $0 La Serena lodging more than offsets that, so the overall estimated budget is actually lower than the previous linear-route version.\n\nSCOPE NOTE: "Sierna" was confirmed as La Serena.\n\nBest time to go: La Serena/Elqui and Patagonia are 3,000+ km apart with different ideal windows. Patagonia peaks Dec-Feb (warm, long days, but busiest/priciest -- book the Torres del Paine lodge and Navimag months ahead); Nov and March are good shoulder months. La Serena/Elqui stargazing is best Mar-Nov (clearer skies, avoid full moon) but is good almost any time given 300+ clear nights/year. November is the best overall compromise; early-to-mid March is the other good option.\n\nCruise leg: keeping the Navimag ferry (Puerto Natales -> Puerto Montt, 4 days/3 nights, Chile-only, functional not luxurious, ~$530/person + $38 boarding fee — book a private cabin for comfort) as your return route from Patagonia, per your choice. The alternative was the Australis expedition cruise (Punta Arenas <-> Ushuaia, upscale/all-inclusive) but that\'s one-way into Ushuaia, ARGENTINA, which would strand you away from La Serena.\n\nTrain note: Chile has very limited long-distance passenger rail -- nothing meaningful connects Santiago, La Serena, or Patagonia. Treating "train" as not really available on this route.\n\nTorres del Paine lodging is still the single biggest cost driver: explora Patagonia / Tierra Patagonia run roughly $400-1,500+ USD/person/night all-inclusive depending on room category and season (so ~$800-3,000+/night for two) vs. more moderate options near Puerto Natales/Puerto Bories (Hotel Rio Serrano, The Singular Patagonia) — Rio Serrano itself currently runs closer to $250-320/night bed & breakfast, more with full board and Chile\'s 19% VAT.\n\nFull research doc with sources: chile-la-serena-patagonia-trip.md, saved alongside this planner (written before this home-base restructuring — the day-by-day shape has changed, but the underlying research on timing, pricing and lodging options still applies).',

      notes: 'ARRONDISSEMENT-BY-ARRONDISSEMENT LOCAL-LIVING GUIDE\n\nFor living locally during a long stay, not just sightseeing through it — organized by arrondissement, working outward from the center. Base neighborhoods (4th, 5th, 6th) covered in depth.\n\n1ST ARR. — LOUVRE / PALAIS ROYAL: Grand and monumental near the Louvre, quieter and residential further from Rue de Rivoli. Museums: the Louvre (go early or late, pick one wing); Musée de l\'Orangerie for Monet\'s Water Lilies; Sainte-Chapelle; Bourse de Commerce (Pinault Collection) for contemporary art; the Conciergerie (Marie Antoinette\'s prison, few crowds). Local living: Palais Royal Gardens, a quieter locals\' version of the Tuileries with the striped Buren Columns; Galerie Véro-Dodat, a beautifully preserved 1826 covered passage. Cafés: Angelina on Rue de Rivoli for hot chocolate; Café Saint Honoré; Jean-Paul Hévin for chocolates. Restaurants: Au Pied de Cochon (classic, open late); Poulette near Châtelet. Shopping: Place Vendôme for jewelry; La Samaritaine, the restored Art Nouveau/Art Deco department store; E. Dehillerin for French kitchenware.\n\n2ND ARR. — BOURSE: Smallest, least touristed, good for slow wandering. Local living: Rue Montorgueil, a pedestrian market street (boulangeries, fromageries, fruit stands) — the everyday shopping street here. Covered passages: Galerie Vivienne, Passage des Panoramas (oldest in Paris, 1799), Passage du Grand Cerf, quieter Passage Bourg-l\'Abbé. Sights: the free Oval Reading Room at the Bibliothèque Nationale (Richelieu site); Grand Rex cinema (Art Deco, backstage tours). Cafés: Stohrer on Rue Montorgueil, oldest pâtisserie in Paris (1730), invented the baba au rhum; A La Mère de Famille for chocolate; Plaq for bean-to-bar chocolate and hot chocolate. Restaurants: Le Chardonnay (truffle croque monsieur); Le Petit Vendôme (steak au poivre); Les Saveurs de l\'Orient in Passage des Panoramas (Moroccan).\n\n3RD/4TH ARR. — LE MARAIS: Best match for food, markets, and wandering — one of the trip\'s recommended bases. Museums/sights: Notre-Dame (reopened Dec. 2024, free, climb the towers if booked ahead); Place des Vosges, the oldest planned square in Paris; Musée Carnavalet (history of Paris, free); Musée Picasso; Maison Victor Hugo. Markets: Marché des Enfants Rouges, the oldest covered food market in Paris (1615) — try Chez Alain Miam Miam for sandwiches; Marché aux Fleurs, the flower market on Île de la Cité. Local living: Rue François-Miron has two genuinely medieval half-timbered houses; Passage de l\'Ancre, the oldest covered passage, now a quiet residential corner; Tour Saint-Jacques, climbable May–November, rooftop views. Cafés: Berthillon on Île Saint-Louis for gelato; Carette on Place des Vosges for hot chocolate; Maison Georges Larnicol for kouign-amann. Restaurants: L\'As du Falafel; Au Petit Versailles du Marais; Bistrot des Tournelles. Shopping: boutiques, vintage, and jewelers around Rue des Francs-Bourgeois and Rue Vieille du Temple.\n\n5TH ARR. — LATIN QUARTER: The oldest part of Paris (Roman Lutetia, 52 BC) and personally recommended as the most lived-in, local-feeling base by the Life in Rural France piece. Museums/sights: the Panthéon (crypts hold Voltaire, Rousseau, Marie Curie, Victor Hugo); Cluny Museum, built into actual Roman bath ruins, with the Lady and the Unicorn tapestries; Jardin des Plantes; Arènes de Lutèce, a 1st-century Roman amphitheater where locals play pétanque. Local living: Rue Mouffetard, the market street to know here — best 10am–1pm, especially Saturdays, closed Sunday afternoon/Monday, start at Square Saint-Médard; Place Monge Market (Wed/Fri/Sun, 7am–2:30pm) as a more local alternative. Books: Shakespeare and Company (expect a line); the bouquinistes (book stalls) along the Seine between Pont Neuf and Pont de la Tournelle, closed in winter. Hidden corners: Arab World Institute\'s rooftop terrace; Musée Curie (small, free, her actual former lab); Rue du Chat-qui-Pêche, the narrowest street in Paris. Cafés: A. Lacroix Patisserie near Notre-Dame (lifelike fruit pastries, also good for lunch); Odette (choux pastries). Restaurants: cheap, cheerful bistros throughout, especially around the Sorbonne.\n\n6TH ARR. — SAINT-GERMAIN-DES-PRÉS: The grown-up café-culture neighborhood, one of the trip\'s three recommended bases. Café de Flore and Les Deux Magots sit across from each other by the Église Saint-Germain-des-Prés — pricier, not the best food, but worth one coffee each for the history (Sartre, de Beauvoir, Hemingway all drank here). Museums/sights: Jardin du Luxembourg, arguably the best central park in Paris; Église Saint-Sulpice, with a striking Cavaillé-Coll organ; Musée Delacroix, small, in his former home/studio. Local living: Cour du Commerce Saint-André, a small covered passage off Boulevard Saint-Germain with Le Procope (often called the oldest restaurant in Paris); Rue de Buci, an 800-year-old street dense with restaurants and bars; Mazarin Library, the oldest public library in France (1643), free to walk through. Cafés: Plaq; Chapon et La Chocolaterie de l\'Église (chocolate mousse in a paper cone). Restaurants: Breizh Café (Breton galettes); La Jacobine (coq au vin); Bistro des Augustins (potato gratins); Le Jardin Saint Germain (book ahead, confit de canard). Shopping: boutiques, bookstores, and chocolatiers along Boulevard Saint-Germain itself.\n\n7TH ARR. — EIFFEL TOWER / INVALIDES: More polished and residential, excellent museums a few blocks off the Champ de Mars. Museums/sights: the Eiffel Tower (book online ahead); Musée d\'Orsay, the world\'s largest Impressionist collection, in a former train station; Musée Rodin, sculptures in an 18th-century mansion and garden; Les Invalides, including Napoleon\'s tomb. Local living: Rue Cler, a pedestrian market street good for picnic supplies for the Champ de Mars, with Fromagerie Cantin and Fromagerie de Grenelle nearby; Marché Saxe-Breteuil (Thu/Sat mornings, 7–2:30), lined up almost perfectly with the Eiffel Tower. Shopping: Le Bon Marché, the oldest department store in Paris and the only one on the Left Bank; La Grande Épicerie next door, a genuinely fun luxury food hall. Cafés: Maison Bergeron (hand-painted ceilings, viennoiseries). Restaurants: Au Bon Accueil on Rue Montessuy (reserve the terrace for a tower view); Les Antiquaires near the Orsay (excellent bœuf bourguignon). Quiet Eiffel Tower viewpoints: Rue de l\'Université and Rue Buenos Ayres frame the tower between Haussmann buildings; Place de Sydney and Avenue de Montessuy are quieter alternatives.\n\n8TH ARR. — ÉLYSÉES: Upscale and monumental along the Champs-Élysées, genuinely residential a few blocks off it. Museums/sights: Musée Jacquemart-André, a 19th-century mansion turned museum, often nearly empty even in high season; Petit Palais, free, with Monet, Cézanne, and Rodin, plus a lovely courtyard café; Galerie Dior (book weeks ahead, sells out). Local living: Parc Monceau, the neighborhood\'s actual local park, more residential than the Tuileries or Luxembourg; La Madeleine, styled like a Greek temple outside, Baroque inside, far less crowded than Notre-Dame. Shopping: the Golden Triangle (Avenue Montaigne, Avenue George V, the Champs-Élysées) for flagship couture; Rue du Faubourg Saint-Honoré for Hermès and Cartier. On the first Sunday of most months the Champs-Élysées closes to cars 11am–5pm — a genuinely different, more local atmosphere. Food here leans toward hotel dining — plan meals elsewhere and treat the 8th as a sightseeing/shopping day.\n\n18TH ARR. — MONTMARTRE: Village-on-a-hill, best treated as atmosphere rather than a checklist. Only became part of Paris in 1860; go early (~9am) for Sacré-Cœur without the crowds. Local living: Rue de l\'Abreuvoir, one of the prettiest short streets in Paris, running from the pink café La Maison Rose down to Place Dalida; 38 staircases woven through the hill\'s streets, worth stumbling onto (Rue Foyatier, Rue du Mont-Cenis, Rue Girardon); Vigne du Clos Montmartre, the last working vineyard within Paris city limits (visible from the street); Musée de Montmartre with the attached Renoir Gardens. Food street: Rue Lepic (between Rue des Abbesses and Boulevard de Clichy) — fromagerie, chocolaterie, bakeries, and Café des Deux Moulins (an Amélie filming location); Le Consulat, a classic café once frequented by Van Gogh, Monet, and Picasso; Gilles Marchal for madeleines; Boris Lumé Bakery for kouign-amann croissants. Sights: Sacré-Cœur (climb into the dome for 360° views, not just the front steps); Place du Tertre for street artists; Cimetière de Montmartre, quieter and equally atmospheric as Père-Lachaise; the Moulin Rouge at the bottom of Rue Lepic.\n\nFor this stay specifically: the 5th (Latin Quarter) gives the most lived-in daily texture (Rue Mouffetard as an everyday market, cheap bistros, old bookshops). The 4th (Marais) is strongest if food and markets matter most day to day. The 6th (Saint-Germain) is the most polished and central, with Luxembourg Gardens and Boulevard Saint-Germain\'s cafés at the door. All three are close enough to treat this entire guide as one neighborhood over a month — the 1st, 2nd, 7th, and 8th are all a 15–25 minute walk away, and Montmartre is a quick Métro ride.\n\nFull arrondissement guide with sources: paris-arrondissement-local-living-guide.md, saved alongside this planner.\n\nSCOPE NOTE: most guides recommend 4-7 days for Paris itself -- 21-30 days is far beyond that, so this is built as Paris as a home base with train extensions radiating out, matching the Train transport mode selected. An Airbnb-first stay fits naturally with a month-long trip (kitchen, laundry, more space than a hotel room).\n\nBest time to go: May and September are the sweet spot -- mild weather (15-23C), manageable crowds, better rates than summer. June-Aug has the longest days but steepest prices and worst queues. Winter (Dec-Feb) is cheapest by far (~35% lower hotel rates than July) with thin crowds if you don\'t mind cold, short days.\n\nOptional international extension (Eurostar from Gare du Nord): London (<2.5h, requires UK passport control, not Schengen), Brussels (~1.5h), Amsterdam (~3.5h). Fares from ~e44 one-way in shoulder season -- book early, prices rise closer to departure.\n\nTrim to ~21 days: cut 2-3 Paris flex/rest days and shorten Provence/Riviera to Avignon only (skip Nice, saves ~3 days). Stretch to 30 days: add a 3-4 day Eurostar extension (London, or Brussels+Amsterdam) after returning to Paris.\n\nFull research doc with sources: paris-rail-trip.md, saved alongside this planner.',

      notes: 'SCOPE NOTE: a full comfortable-pace loop of Sicily is typically recommended at ~14 days, so 21-28 days leaves real room to slow down and add the Aeolian Islands as a proper multi-day extension -- also the natural fit for the Cruise transport mode (hydrofoil/ferry island-hopping off the north coast). The 1-4 hr/day driving cap fits well: standard loop legs mostly run 1-3.5 hours already.\n\nBest time to go: April-June and Sept-Oct are the sweet spot (mild, lighter crowds, better rates). July-Aug is hot and crowded, especially inland and at beaches/resorts. Winter (Nov-Mar) is cheapest/quietest but chilly, and some resort-style coastal properties reduce hours or close off-season.\n\nDon\'t keep the rental car inside Palermo, Catania, or Syracuse historic centers (narrow ZTL-restricted streets) -- pick up/drop off at the city edge or airport.\n\nTrim to ~21 days: cut the Aeolian Islands to just Lipari + Vulcano (saves ~3 days), drop a free/rest day in Taormina or Syracuse. Stretch to 28 days: add a 3-4 day Malta extension via the Pozzallo ferry (fits between Ragusa and Syracuse), an extra Aeolian island, or Piazza Armerina (Villa Romana del Casale mosaics).\n\nFull research doc with sources: sicily-loop-trip.md, saved alongside this planner.',

function tripStatus_EN(trip){
  if(!trip.startDate) return {label:'Unscheduled', cls:'badge-past'};
  const start = daysUntil(trip.startDate);
  const end = trip.endDate ? daysUntil(trip.endDate) : start;
  if(end < 0) return {label:'Past', cls:'badge-past'};
  if(start <= 0 && end >= 0) return {label:'Ongoing', cls:'badge-ongoing'};
  return {label:'Upcoming', cls:'badge-upcoming'};
}
function tripStatus_FR(trip){
  if(!trip.startDate) return {label:'Non planifié', cls:'badge-past'};
  const start = daysUntil(trip.startDate);
  const end = trip.endDate ? daysUntil(trip.endDate) : start;
  if(end < 0) return {label:'Passé', cls:'badge-past'};
  if(start <= 0 && end >= 0) return {label:'En cours', cls:'badge-ongoing'};
  return {label:'À venir', cls:'badge-upcoming'};
}
function countdownText_EN(trip){
  const st = tripStatus(trip);
  if(st.label==='Upcoming'){
    const n = daysUntil(trip.startDate);
    return n===0 ? 'Starts today' : n===1 ? '1 day to go' : n+' days to go';
  }
  if(st.label==='Ongoing') return 'Happening now';
  if(st.label==='Past') return 'Completed';
  return 'Add dates to see countdown';
}
function countdownText_FR(trip){

function handleImport_EN(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.trips)) throw new Error('bad format');
      showConfirm('Import trips?', 'This will replace all trips currently in the dashboard with the ones from this file.', ()=>{
        state = data;
        ui.selectedTripId = null;
        render();
        toast('Trips imported');
      });
    }catch(e){
      toast('Could not read that file — not a valid Travel Planner export');
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

    lines.push(`Dates: ${t.startDate? fmtDate(t.startDate) : '(not set)'} to ${t.endDate? fmtDate(t.endDate) : '(not set)'}`);

  if(t.routeType && t.routeType!=='roundtrip') lines.push(`Route type: ${routeLabel(t.routeType)}`);
  if(t.driveMinHours || t.driveMaxHours) lines.push(`Driving preference: ${t.driveMinHours||'?'}-${t.driveMaxHours||'?'} hrs/day`);
  if(t.accommodationPrefs && t.accommodationPrefs.length) lines.push(`Accommodation preference (priority order): ${t.accommodationPrefs.map(accommodationLabel).join(' > ')}`);
  if(t.petFriendly) lines.push('Must be pet-friendly');
  if(t.accessibilityNeeds && t.accessibilityNeeds.length) lines.push(`Accessibility needs: ${t.accessibilityNeeds.map(v=>ACCESSIBILITY_NEEDS.find(a=>a.v===v).label).join(', ')}`);
  if(t.waypoints && t.waypoints.length){
    lines.push('');

      lines.push(`  ${i+1}. ${wp.location || '(unnamed stop)'}${wp.date? ' - '+fmtDate(wp.date):''}${wp.nights? ' - '+wp.nights+' night'+(wp.nights=='1'?'':'s'):''}${wp.notes? ' - '+wp.notes:''}`);

  }
  if(t.days && t.days.length){
    lines.push('');

      const acts = (d.activities||[]).map(a=>[a.time,a.title,a.location].filter(Boolean).join(' — ')).filter(Boolean).join('; ');
      lines.push(`  ${d.label}${d.date? ' ('+fmtDate(d.date)+')':''}: ${acts || '(no activities set)'}`);
    });
  }
  if(t.bookings && t.bookings.length){
    lines.push('');
    lines.push('Bookings / reservations status:');
    t.bookings.forEach(b=>{
      const status = b.confirmation ? `BOOKED — conf# ${b.confirmation}` : 'not yet booked';
      lines.push(`  - ${b.title || b.type} (${b.type}): ${status}${b.notes? ' — '+b.notes:''}`);
    });
  }
  const bud = computeBudget(t);
  if(bud.total>0){
    lines.push('');

function printSection_EN(tripId, mode){

    if(t.notes && t.notes.trim()) html += '<h3>Destination Research &amp; Notes</h3>' + researchHtml(t);

  html += printFooterHtml(t.name ? `${t.name} — ${label}` : label);

  const prevTitle = document.title;

}

function tripTravelMonths_EN(t){
  if(!t || !t.startDate) return [];
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const start = new Date(t.startDate+'T00:00:00');
  if(isNaN(start)) return [];
  const end = t.endDate ? new Date(t.endDate+'T00:00:00') : start;
  const months = new Set();
  let cur = new Date(start.getFullYear(), start.getMonth(), 1);
  const endMonth = new Date(end.getFullYear(), end.getMonth(), 1);
  let guard = 0;
  while(cur<=endMonth && guard<24){ months.add(names[cur.getMonth()]); cur.setMonth(cur.getMonth()+1); guard++; }
  return [...months];
}

  if(!t || !t.startDate) return [];

  const start = new Date(t.startDate+'T00:00:00');

}
function climateHtml_EN(t){
  if(!t) return '<div class="tt-empty">Select a trip above.</div>';
  const data = (state.travelTools && state.travelTools.climate) ? state.travelTools.climate[t.id] : null;
  if(!data){
    return `<div class="tt-empty"><strong>No climate data yet for ${esc(t.destination||t.name||'this trip')}.</strong><br>Ask Claude to research climate averages &mdash; and a forecast, if the trip is coming up soon &mdash; for this destination.</div>`;
  }
  const daysOut = (!t.flexibleDates && t.startDate) ? daysUntil(t.startDate) : null;
  const soon = daysOut!==null && daysOut>=0 && daysOut<=TT_FORECAST_WINDOW_DAYS;
  const travelMonths = tripTravelMonths(t);
  let html = '';
  if(soon){
    if(data.forecastSnapshot){
      html += `<div class="tt-forecast-banner">${ICONS.cloud} <strong>Trip starts in ${daysOut} day${daysOut===1?'':'s'}</strong> &mdash; actual forecast as of ${esc(data.forecastSnapshot.asOf)}: ${esc(data.forecastSnapshot.summary)}</div>`;
    } else {
      html += `<div class="tt-forecast-banner">${ICONS.cloud} <strong>Trip starts in ${daysOut} day${daysOut===1?'':'s'}</strong> &mdash; you're within forecast range (~${TT_FORECAST_WINDOW_DAYS} days). Ask Claude to pull an actual forecast for ${esc(t.destination||t.name)} and it'll show here instead of averages alone.</div>`;
    }
  }
  html += `<table class="tt-months-table"><thead><tr><th>Month</th><th>High</th><th>Low</th><th>Rain days</th><th>Rainfall</th></tr></thead><tbody>`;
  data.monthly.forEach(m=>{
    const isTravelMonth = travelMonths.includes(m.m);
    html += `<tr class="${isTravelMonth?'tt-travel-month':''}"><td>${esc(m.m)}${isTravelMonth?' &#9733;':''}</td><td>${m.hiF}&deg;F</td><td>${m.loF}&deg;F</td><td>${m.rainDays}</td><td>${m.rainIn}&Prime;</td></tr>`;
  });
  html += `</tbody></table>`;
  if(travelMonths.length){
    html += `<div style="font-size:11px;color:var(--text-muted);margin:2px 0 0">&#9733; = month${travelMonths.length>1?'s':''} this trip falls in</div>`;
  }
  if(data.patterns){
    html += `<div class="tt-patterns-note"><strong>Seasonal patterns:</strong> ${esc(data.patterns)}</div>`;
  }
  html += `<div class="tt-source">Source: ${esc(data.source)} &middot; snapshot as of ${esc(data.asOf)}</div>`;
  return html;
}

/* ---------------- Live AI research (optional Netlify Function backend) ----------------
   If /api/travel-research isn't deployed (or has no API key configured), this fails
   silently and the request just stays "pending" for the manual copy/paste-to-Claude
   workflow below -- so this file works identically with or without the backend. */
const RESEARCH_ENDPOINT = '/api/travel-research';
const TRIP_BRIEF_ENDPOINT = '/api/trip-brief';
async function runAiTripBrief(tripId, briefText){
  const t = (state.trips||[]).find(x=>x.id===tripId);
  if(!t) return;
  // Only auto-fill a trip that's still empty -- never overwrite an itinerary the
  // traveler has already started building or editing by hand.
  if((t.days && t.days.length) || (t.bookings && t.bookings.length)) return;
  try {
    const resp = await fetch(TRIP_BRIEF_ENDPOINT, {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ brief: briefText, destination: t.destination, lang: LANG })
    });
    if(!resp.ok) return;
    const data = await resp.json();
    if(!data || !Array.isArray(data.days)) return;
    // Re-check after the await in case the traveler started editing while this was in flight.
    if((t.days && t.days.length) || (t.bookings && t.bookings.length)) return;
    t.days = data.days.map(d => ({
      id: uid(), label: d.label || '', date: d.date || '',
      activities: Array.isArray(d.activities) ? d.activities.map(a => ({
        id: uid(), time: a.time||'', title: a.title||'', location: a.location||'', notes: a.notes||'', estCost: a.estCost||''
      })) : []
    }));
    t.bookings = Array.isArray(data.bookings) ? data.bookings.map(b => ({
      id: uid(), type: b.type||'other', title: b.title||'', confirmation:'', date:'', time:'',
      provider: b.provider||'', link:'', notes: b.notes||'', estCost: b.estCost||''
    })) : [];
    if(data.notes){ t.notes = t.notes ? (t.notes + '\n\n' + data.notes) : data.notes; }
    render();
    toast(LANG==='fr' ? 'Itinéraire rempli par Claude -- vérifie et ajuste au besoin.' : 'Itinerary filled in by Claude -- review and adjust as needed.');
  } catch(e) {
    // No backend configured, or offline -- the copied brief / paste-to-chat workflow still works.
  }
}
async function runAiResearch(reqId, kind){
  const r = (state.quickResearch||[]).find(x=>x.id===reqId);
  if(!r) return;
  try {
    const resp = await fetch(RESEARCH_ENDPOINT, {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({
        kind, location:r.location, category:r.category, startDate:r.startDate,
        endDate:r.endDate, minDays:r.minDays, maxDays:r.maxDays, notes:r.notes, lang:LANG
      })
    });
    if(!resp.ok) return;
    const data = await resp.json();
    if(!data || !data.summary) return;
    r.status = 'answered';
    r.summary = data.summary || '';
    r.options = Array.isArray(data.options) ? data.options.slice(0,6) : [];
    r.answeredAt = todayStr();
    render();
  } catch(e) {
    // No backend configured, or offline -- request stays pending, no user-facing error.
  }
}

/* ---------------- Master render ---------------- */
function render(){
  renderSidebar();
  if(ui.activeSection==='longweekends'){ renderLongWeekends(); return; }
  if(ui.activeSection==='traveltools'){ renderTravelTools(); return; }
  if(ui.selectedTripId && getTrip(ui.selectedTripId)) renderTrip();
  else renderHome();
}

/* ---------------- Language switching ---------------- */
function applyShellText(){
  const T = LANG==='fr'
    ? { title:'Planificateur de voyage', tagline:'Vos voyages, itin\u00e9raires et r\u00e9servations, tous au m\u00eame endroit', darkMode:'Basculer le mode sombre', importBtn:'Importer', exportBtn:'Exporter', newTripBtn:'Nouveau voyage', tripsHeading:'Voyages' }
    : { title:'Travel Planner', tagline:'Your trips, itineraries &amp; bookings in one place', darkMode:'Toggle dark mode', importBtn:'Import', exportBtn:'Export', newTripBtn:'New Trip', tripsHeading:'Trips' };
  const set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set('shellTitle', T.title);
  set('shellTagline', T.tagline);
  set('shellImportText', T.importBtn);
  set('shellExportText', T.exportBtn);
  set('shellNewTripText', T.newTripBtn);
  set('shellTripsHeading', T.tripsHeading);
  const dm = document.getElementById('shellDarkModeBtn'); if(dm) dm.setAttribute('title', T.darkMode);
  document.title = T.title;
  const enBtn = document.getElementById('langToggleEn'), frBtn = document.getElementById('langToggleFr');
  if(enBtn) enBtn.classList.toggle('active', LANG==='en');
  if(frBtn) frBtn.classList.toggle('active', LANG==='fr');
}
function applyLang(lang){
  LANG = lang;
  state = STATE_BY_LANG[lang];
  ui = UI_BY_LANG[lang];
  TRANSPORT_MODES = lang==='fr' ? TRANSPORT_MODES_FR : TRANSPORT_MODES_EN;
  CURRENCY_NAMES = lang==='fr' ? CURRENCY_NAMES_FR : CURRENCY_NAMES_EN;
  ROUTE_TYPES = lang==='fr' ? ROUTE_TYPES_FR : ROUTE_TYPES_EN;
  CABIN_CLASSES = lang==='fr' ? CABIN_CLASSES_FR : CABIN_CLASSES_EN;
  ACCOMMODATION_TYPES = lang==='fr' ? ACCOMMODATION_TYPES_FR : ACCOMMODATION_TYPES_EN;
  ACCESSIBILITY_NEEDS = lang==='fr' ? ACCESSIBILITY_NEEDS_FR : ACCESSIBILITY_NEEDS_EN;
  BOOKING_TYPES = lang==='fr' ? BOOKING_TYPES_FR : BOOKING_TYPES_EN;
  PRINT_SECTION_LABELS = lang==='fr' ? PRINT_SECTION_LABELS_FR : PRINT_SECTION_LABELS_EN;
  QR_CATEGORY_TAB_LABELS = lang==='fr' ? QR_CATEGORY_TAB_LABELS_FR : QR_CATEGORY_TAB_LABELS_EN;
  QR_OTHER_TAB_CATEGORIES = lang==='fr' ? QR_OTHER_TAB_CATEGORIES_FR : QR_OTHER_TAB_CATEGORIES_EN;
  closeModal();
  applyShellText();
  render();
}
function chooseLang(lang){
  const root = document.getElementById('modalRoot');
  if(root) root.innerHTML = '';
  applyLang(lang);
}
function toggleLang(){
  if(!LANG) return;
  applyLang(LANG==='fr' ? 'en' : 'fr');
}
function showLangChooser(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="langChooserOverlay" style="align-items:center">

          <button class="btn btn-primary" style="flex:1;padding:14px 10px;font-size:15px" onclick="chooseLang('en')">English</button>
          <button class="btn btn-primary" style="flex:1;padding:14px 10px;font-size:15px" onclick="chooseLang('fr')">Fran\u00e7ais</button>
        </div>
        <p style="color:var(--text-muted);font-size:11px;margin-top:16px">You can switch anytime with the EN / FR toggle in the top bar. &middot; Tu peux changer en tout temps avec le bouton EN / FR en haut.</p>
      </div>
    </div>`;
}
