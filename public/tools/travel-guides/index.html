<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Guides</title>
<style>
  :root[data-theme="light"]{
    --bg:#f3f6fb; --surface:#ffffff; --surface-alt:#f8fafc; --border:#e3e8f0;
    --text:#0f172a; --text-muted:#647089; --primary:#1d4ed8; --primary-hover:#1741b3;
    --primary-light:#e2eafd; --teal:#0d9488; --teal-light:#d9f5f1; --amber:#b45309; --amber-light:#fef1d6;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06); --shadow-md:0 8px 24px -12px rgba(15,23,42,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0a0f1c; --surface:#111a2c; --surface-alt:#0d1526; --border:#233150;
    --text:#e8edf7; --text-muted:#93a1bd; --primary:#6d93ff; --primary-hover:#87a5ff;
    --primary-light:#1c2c52; --teal:#3fd8c6; --teal-light:#0f342f; --amber:#f2b84b; --amber-light:#3a2c10;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 28px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5}
  a{color:inherit}
  .icon{width:18px;height:18px;flex:none}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;
    background:var(--surface);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
  .brand h1{margin:0;font-size:17px;line-height:1.2}
  .brand p{margin:0;font-size:12.5px;color:var(--text-muted)}
  .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--text);font:600 13.5px/1.2 inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--surface-alt)}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-ghost{border-color:transparent;background:transparent}
  .pill{display:flex;border:1.5px solid var(--border);border-radius:999px;overflow:hidden}
  .pill button{border:0;background:transparent;padding:7px 13px;font:800 12px/1 inherit;color:var(--text-muted);cursor:pointer}
  .pill button+button{border-left:1.5px solid var(--border)}
  .pill button.on{background:var(--primary-light);color:var(--primary)}
  main{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
  .intro h2{margin:0 0 6px;font-size:26px}
  .intro p{margin:0;color:var(--text-muted);max-width:720px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 20px}
  .filters span{font-size:13px;color:var(--text-muted);margin-right:4px}
  .chip{border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;
    font:600 13px/1.2 inherit;cursor:pointer}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .lang-section{margin-top:26px}
  .lang-section h3{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .lang-section h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column}
  .card:hover{box-shadow:var(--shadow-md)}
  .cover{display:block;aspect-ratio:520/673;background:var(--surface-alt);overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .card:hover .cover img{transform:scale(1.03)}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .body h4{margin:0;font-size:16.5px;line-height:1.3}
  .blurb{margin:0;font-size:13.5px;color:var(--text-muted);flex:1}
  .meta{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text-muted)}
  .tag.new{background:var(--amber-light);color:var(--amber);border-color:transparent}
  .tag.lg{background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787);color:#fff;border:0;text-shadow:0 1px 1px rgba(0,0,0,.35)}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .actions .btn{justify-content:center}
  .also{margin:14px 0 0;font-size:13.5px;color:var(--text-muted)}
  .also button{border:0;background:none;padding:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
  .empty{color:var(--text-muted);font-size:14px}
  footer{margin-top:40px;font-size:12.5px;color:var(--text-muted)}
  @media (max-width:640px){
    .topbar{padding:10px 16px;flex-wrap:wrap}
    .brand p{display:none}
    main{padding:20px 16px 48px}
    .grid{grid-template-columns:1fr 1fr;gap:12px}
    .body{padding:10px 11px 12px}
    .blurb{display:none}
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/tools/travel-planner/">
    <div class="brand-mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4H9a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5h-6A1.5 1.5 0 0 1 2 16Z"/><path d="M22 5.5A1.5 1.5 0 0 0 20.5 4H15a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5h6a1.5 1.5 0 0 0 1.5-1.5Z"/></svg></div>
    <div><h1 id="tTitle">Travel Guides</h1><p id="tTag">Illustrated local-living guides to read or download</p></div>
  </a>
  <div class="spacer"></div>
  <a class="btn" id="backBtn" href="/tools/travel-planner/"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> <span id="tBack">Travel Planner</span></a>
  <button class="btn btn-ghost" id="themeBtn" title="Dark mode" onclick="toggleTheme()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
  <div class="pill"><button id="uiEn" onclick="setUi('en')">EN</button><button id="uiFr" onclick="setUi('fr')">FR</button></div>
</header>

<main>
  <div class="intro">
    <h2 id="tH2">Our travel guides</h2>
    <p id="tIntro"></p>
  </div>
  <div class="filters">
    <span id="tShow">Show editions in:</span>
    <button class="chip" data-f="en" onclick="setFilter('en')">English</button>
    <button class="chip" data-f="fr" onclick="setFilter('fr')">Français</button>
    <button class="chip" data-f="all" onclick="setFilter('all')" id="chipAll">Both languages</button>
  </div>
  <div id="list"></div>
  <footer id="tFoot"></footer>
</main>

<script>
/* To add a guide: drop its PDF(s) in pdf/ and a cover in covers/, then add an entry here. */
const GUIDES = [
  { id:'playa', added:'2026-09-27', pages:{en:40, fr:40}, lgbt:true,
    en:{ title:'Playa del Carmen & the Riviera Maya', file:'Playa del Carmen Guide - Area by Area.pdf', mb:4.7,
         blurb:'The Quinta, Playacar and the local side, plus day trips to Cozumel, the cenotes, Akumal, Tulum, Cobá, Chichén Itzá and Cancún — and 2–3 day escapes to Mérida, Bacalar and Holbox.' },
    fr:{ title:'Playa del Carmen et la Riviera Maya', file:'Guide de Playa del Carmen - Secteur par secteur.pdf', mb:4.7,
         blurb:'La Quinta, Playacar et le côté local, des excursions à Cozumel, aux cénotes, à Akumal, Tulum, Cobá, Chichén Itzá et Cancún — et des escapades de 2 ou 3 jours à Mérida, Bacalar et Holbox.' } },
  { id:'sicily', added:'2026-09-27', pages:{en:46, fr:45}, lgbt:true,
    en:{ title:'Sicily, Region by Region', file:'Sicily Guide - Region by Region.pdf', mb:6.5,
         blurb:'Arab-Norman gold, Greek temples in wheat fields, Baroque towns, fish markets and a volcano on the skyline. 13 regions, Palermo & Ortigia as bases, plus the islands and Malta.' },
    fr:{ title:'La Sicile, région par région', file:'Guide de la Sicile - Région par région.pdf', mb:6.5,
         blurb:'Ors arabo-normands, temples grecs dans les blés, villes baroques, marchés aux poissons et un volcan à l’horizon. 13 régions, Palerme et Ortygie comme ports d’attache, les îles et Malte.' } },
  { id:'santafe', added:'2026-09-27', pages:{en:40}, lgbt:true,
    en:{ title:'Santa Fe, Neighbourhood by Neighbourhood', file:'Santa Fe Guide - Neighbourhood by Neighbourhood.pdf', mb:6.0,
         blurb:'Adobe lanes, red or green chile, Pueblo pottery and Canyon Road galleries. 9 neighbourhoods and 8 day trips, from Taos to Tent Rocks.' } },
  { id:'malta', added:'2026-09-27', pages:{en:42, fr:42}, lgbt:true,
    en:{ title:'Malta & Gozo, Area by Area', file:'Malta Guide - Area by Area.pdf', mb:5.9,
         blurb:'Harbour towns, temples older than the pyramids, village festas and rock-ledge swims. 11 areas across Malta and Gozo, plus Comino and Sicily.' },
    fr:{ title:'Malte et Gozo, secteur par secteur', file:'Guide de Malte - Secteur par secteur.pdf', mb:5.9,
         blurb:'Villes portuaires, temples plus vieux que les pyramides, fêtes de village et baignades sur les rochers. 11 secteurs à Malte et à Gozo, plus Comino et la Sicile.' } },
  { id:'paris', added:'2026-09-27', pages:{en:40, fr:40}, lgbt:true,
    en:{ title:'Paris, Arrondissement by Arrondissement', file:'Paris Guide - Arrondissement by Arrondissement.pdf', mb:8.4,
         blurb:'Cafés, markets, restaurants, shopping, walks and sights for a month of living in Paris, arrondissement by arrondissement, with rail extensions.' },
    fr:{ title:'Paris, arrondissement par arrondissement', file:'Guide de Paris - Arrondissement par arrondissement.pdf', mb:8.4,
         blurb:'Cafés, marchés, restos, magasinage, promenades et attraits pour un mois à vivre à Paris, arrondissement par arrondissement, avec excursions en train.' } },
];

const TXT = {
  en:{ title:'Travel Guides', tag:'Illustrated local-living guides to read or download', back:'Travel Planner', theme:'Toggle dark mode',
       h2:'Our travel guides',
       intro:'Month-long, local-living guides with maps, photos and gay-friendly places flagged. Read them in your browser or download the PDF — they work on a phone, tablet or computer, anywhere.',
       show:'Show editions in:', all:'Both languages', read:'Read online', dl:'Download', pages:'pages', lgbt:'LGBTQ+ places flagged',
       newT:'New', onlyEn:'English only', secEn:'English editions', secFr:'Éditions en français',
       none:'No guides in this language yet.', alsoEn:'Also available in English only:', foot:'PDFs open in your browser’s viewer; Download saves the file to your device.' },
  fr:{ title:'Guides de voyage', tag:'Guides illustrés pour y vivre comme chez soi, à lire ou à télécharger', back:'Planificateur', theme:'Basculer le mode sombre',
       h2:'Nos guides de voyage',
       intro:'Des guides pour un séjour d’un mois, avec cartes, photos et adresses accueillantes LGBTQ+ signalées. Lisez-les dans le navigateur ou téléchargez le PDF — sur téléphone, tablette ou ordinateur, où que vous soyez.',
       show:'Afficher les éditions en :', all:'Les deux langues', read:'Lire en ligne', dl:'Télécharger', pages:'pages', lgbt:'Adresses LGBTQ+ signalées',
       newT:'Nouveau', onlyEn:'En anglais seulement', secEn:'English editions', secFr:'Éditions en français',
       none:'Aucun guide dans cette langue pour l’instant.', alsoEn:'Aussi offert en anglais seulement :', foot:'Les PDF s’ouvrent dans le lecteur du navigateur; « Télécharger » enregistre le fichier sur votre appareil.' }
};

const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
                set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const qs = new URLSearchParams(location.search);
let UI = (qs.get('lang') || store.get('tg_lang') || store.get('tp_lang') || (navigator.language||'en')).slice(0,2) === 'fr' ? 'fr' : 'en';
let FILTER = store.get('tg_filter') || UI;
if(!['en','fr','all'].includes(FILTER)) FILTER = UI;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BASE = '/tools/travel-guides/';
const pdfUrl = f => BASE + 'pdf/' + encodeURIComponent(f);
const isNew = g => (Date.now() - new Date(g.added).getTime()) < 30*864e5;

function card(g, L){
  const T = TXT[UI], e = g[L];
  const url = pdfUrl(e.file);
  const tags = [
    `<span class="tag">${L==='fr'?'Français':'English'}</span>`,
    `<span class="tag">${g.pages[L]} ${T.pages} · ${e.mb.toLocaleString(UI==='fr'?'fr-CA':'en')} MB</span>`,
    !g.fr ? `<span class="tag">${T.onlyEn}</span>` : '',
    isNew(g) ? `<span class="tag new">${T.newT}</span>` : '',
    g.lgbt ? `<span class="tag lg hide-sm">${T.lgbt}</span>` : ''
  ].join('');
  return `<article class="card">
    <a class="cover" href="${url}" target="_blank" rel="noopener" title="${esc(T.read)}"><img src="${BASE}covers/${g.id}-${L}.jpg" alt="${esc(e.title)}" loading="lazy"></a>
    <div class="body">
      <h4>${esc(e.title)}</h4>
      <p class="blurb">${esc(e.blurb)}</p>
      <div class="meta">${tags}</div>
      <div class="actions">
        <a class="btn btn-primary" href="${url}" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>${T.read}</a>
        <a class="btn" href="${url}" download="${esc(e.file)}"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>${T.dl}</a>
      </div>
    </div>
  </article>`;
}

function section(L){
  const T = TXT[UI];
  const items = GUIDES.filter(g => g[L]);
  return `<section class="lang-section" lang="${L==='fr'?'fr-CA':'en'}">
    <h3>${L==='fr' ? T.secFr : T.secEn}</h3>
    ${items.length ? `<div class="grid">${items.map(g => card(g, L)).join('')}</div>` : `<p class="empty">${T.none}</p>`}
    ${(L==='fr' && FILTER==='fr' && GUIDES.some(g => !g.fr)) ? `<p class="also">${T.alsoEn} <button onclick="setFilter('en')">${GUIDES.filter(g => !g.fr).map(g => esc(g.en.title.split(',')[0])).join(', ')}</button></p>` : ''}
  </section>`;
}

function render(){
  const T = TXT[UI];
  document.documentElement.lang = UI==='fr' ? 'fr-CA' : 'en';
  document.title = T.title;
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  set('tTitle', T.title); set('tTag', T.tag); set('tBack', T.back); set('tH2', T.h2);
  set('tIntro', T.intro); set('tShow', T.show); set('chipAll', T.all); set('tFoot', T.foot);
  document.getElementById('themeBtn').title = T.theme;
  const back = '/tools/travel-planner/';
  document.getElementById('backBtn').href = back;
  document.querySelector('.brand').href = back;
  document.getElementById('uiEn').classList.toggle('on', UI==='en');
  document.getElementById('uiFr').classList.toggle('on', UI==='fr');
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.f === FILTER));
  const order = FILTER==='all' ? (UI==='fr' ? ['fr','en'] : ['en','fr']) : [FILTER];
  document.getElementById('list').innerHTML = order.map(section).join('');
}
function setUi(l){ UI = l; store.set('tg_lang', l); if(FILTER!=='all'){ FILTER = l; store.set('tg_filter', l); } render(); }
function setFilter(f){ FILTER = f; store.set('tg_filter', f); render(); }
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); }
function toggleTheme(){
  const t = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  applyTheme(t); store.set('tg_theme', t);
}
applyTheme(store.get('tg_theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
render();
</script>
</body>
</html>
